name: Build Chattec IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project Chattec.xcodeproj \
            -scheme Chattec \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/Chattec.app ./Payload/
          zip -r Chattec.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Chattec-IPA
          path: Chattec.ipa
